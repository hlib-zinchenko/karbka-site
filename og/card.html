<!doctype html>
<!-- Source for the link-sharing previews, img/og-image.png (English) and img/og-image-uk.png (Ukrainian).
     Re-render both with the commands in README.md. Not a page: robots.txt keeps crawlers out of /og/. -->
<html lang="en">
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Karbka preview image</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  html, body { margin: 0; background: #b0a3ce; overflow: hidden; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    display: flex; align-items: center; gap: 56px; padding: 0 88px 0 64px;
    color: #2b2142; font-family: 'Onest Variable', sans-serif;
  }
  .stack { flex: none; width: 430px; height: 510px; filter: drop-shadow(0 10px 0 rgb(62 49 102 / 0.18)); }
  h1 { margin: 0; font: 900 112px/1 'Murecho Variable', sans-serif; letter-spacing: -0.03em; }
  .slogan { margin: 18px 0 0; font-size: 46px; font-weight: 800; line-height: 1.15; }
  p { margin: 18px 0 34px; font-size: 38px; font-weight: 500; line-height: 1.25; color: #3e3166; }
  ul { display: flex; flex-wrap: wrap; gap: 14px; margin: 0; padding: 0; list-style: none; }
  li { padding: 12px 22px; border-radius: 999px; background: #fcfbff; box-shadow: 0 5px 0 #8c7bb8; font-size: 26px; font-weight: 700; color: #3e3166; }
  html[lang='uk'] body { gap: 44px; padding-right: 64px; }
  li.mint { background: #a8e4cb; box-shadow: 0 5px 0 #5fa88a; }
</style>

<div>
  <h1 data-t="name">Karbka</h1>

<script>
  // og/card.html#uk renders the Ukrainian preview.
  if (location.hash === '#uk') {
    document.documentElement.lang = 'uk';
    const uk = {
      name: 'Карбка',
      slogan: 'Закарбуй у памʼяті.',
      lede: 'Флешкартки зі свайпом<br />для телефона, планшета<br />й компʼютера.',
      free: 'Безкоштовно',
      account: 'Без акаунта',
      offline: 'Офлайн',

    for (const el of document.querySelectorAll('[data-t]')) el.innerHTML = uk[el.dataset.t];
  }
